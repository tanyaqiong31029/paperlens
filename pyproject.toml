# 工程规范工具配置（ruff lint/format + mypy 类型检查起步档）
# 说明：本文件不含 build-system，仅承载工具配置；运行依赖见 backend/requirements*.txt

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["backend/data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
# E501：仓库内大量中文注释与长 URL/字符串，ruff format 不会折行，强制 100 列噪音过大，交由 format 约束代码行宽
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入惯用法：File()/Depends() 出现在参数默认值中
"backend/app/**" = ["B008"]

# ---- 类型检查（宽松起步档：当前存量 15 个错误，收敛后再纳入 CI）----
[tool.mypy]
python_version = "3.10"
files = ["backend"]
ignore_missing_imports = true
exclude = ["backend/data"]
