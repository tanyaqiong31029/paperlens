# 本地提交安检（仓库根执行 `pre-commit install` 后生效）：
#   - 文件卫生：行尾空白 / 文件末尾换行 / YAML/TOML 语法 / 合并冲突标记 / 私钥
#   - ruff：backend/**/*.py 的 lint --fix 与 format（与 pyproject.toml、CI 同一套规则）
#   - gitleaks：提交前密钥扫描（与 .github/workflows/tests.yml 的 gitleaks job 双保险）
# 全量历史密钥扫描由 tests.yml 的 gitleaks job 负责兜底。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(png|jpe?g|gif|webp|ico|pdf|db|docx|pptx|xlsx|zip)$
      - id: end-of-file-fixer
        exclude: \.(png|jpe?g|gif|webp|ico|pdf|db|docx|pptx|xlsx|zip)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
